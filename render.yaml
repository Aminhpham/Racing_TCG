services:
  - type: web
    name: racing-tcg
    runtime: python
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn -k eventlet -w 1 "run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: racing-tcg-db
          property: connectionString
      - key: FLASK_APP
        value: run.py

databases:
  - name: racing-tcg-db
    plan: free
